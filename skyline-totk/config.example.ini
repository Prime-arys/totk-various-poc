# Copy to sd:/skyline/totk/config.ini. Every setting is optional.

# Log sinks: none | kernel | sd | tcp, combinable ("sd,tcp"), or "all".
#   kernel = svcOutputDebugString, visible to emulators and debuggers
#   sd     = appended to log_path
#   tcp    = served on tcp_port (cargo skyline listen <ip>); takes over the
#            game's socket stack, so only enable it for debugging
log = sd
log_path = sd:/skyline/totk/skyline.log
tcp_port = 6969

# Load plugins.
plugins = 1

# Where plugins are looked up first (romfs:/skyline/plugins is still read
# afterwards). Keep plugins out of atmosphere/contents/<title>/romfs: any file
# there makes Atmosphere build a layered romfs over TotK's ~300 000 entries at
# every boot, which is slow and can stop the game from booting.
plugins_dir = sd:/atmosphere/contents/0100F2C0115B6000/skyline/plugins
