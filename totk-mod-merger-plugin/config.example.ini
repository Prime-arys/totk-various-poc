# Copy to sd:/totk/config.ini. Every setting is optional.

# Master switch for the merger.
enabled = 1

# Where mods live: one folder per mod, holding romfs/ (and exefs/) or a TKMM
# .tkcl package, plus an optional mod.ini.
mods_dir = sd:/totk/mods

# The active profile: sd:/totk/profiles/<name>.ini lists the mods to merge,
# their order (first wins) and options. Empty: every mod, by mod.ini priority.
profile =
profiles_dir = sd:/totk/profiles

# When the mods changed since the last merge: merge while the game boots (1),
# or keep serving the last merge until totk-mod-manager applies them (0).
merge_at_boot = 1

# Where merges are kept: one folder per merge, and their files in store/
# (a file several merges produce is written once).
merged_dir = sd:/totk/merged

# How many merges to keep, most recently used first. Going back to mods merged
# before (another profile, a mod turned on again) serves the kept merge at once.
merge_cache_size = 10

# Changelogs worked out for folder mods, reused while their files do not change.
cache_dir = sd:/totk/cache

# Merge log, or empty to only log through Skyline.
log_path = sd:/totk/merger.log

# Merge again even if a kept merge matches (delete merged/ to the same effect).
force_merge = 0

# Also merge what TKMM exported for RomFSlite (TKMM > Export > RomFSlite), under
# every other mod. Handy to keep a TKMM profile made on a PC and add mods on top.
use_romfslite = 1
romfslite_dir = sd:/atmosphere/contents/0100F2C0115B6000/romfslite

# Message archives to merge: "auto" (the language the game reads, recorded in
# sd:/totk/locale.txt at boot; every language until then), "all", or a list
# such as USen,EUfr. Fewer locales make merges of text mods much faster.
locales = auto

# Apply code patches shipped by mods (exefs/*.ips, exefs/*.pchtxt) in memory.
apply_patches = 1

# Load the Skyline plugins mods ship (<mod>/plugin.nro, <mod>/plugins/*.nro),
# once the merge is served. This is how several code mods coexist: a console
# has room for one exefs, and Skyline is already in it. A single mod's code is
# left out with "plugins = 0" in its mod.ini.
mod_plugins = 1

# TKMM raises the shop parameter limit on every merge; 0 leaves the game alone.
shop_param_limit = 512

# Longest wait for a plugin that took control of the mod list (tkm_* API).
control_timeout_ms = 60000

# Log the first files the game reads from the merged output, to confirm mods
# are being served. Off by default: it writes to the SD card while loading.
log_redirects = 0

# Log details of the merge (keyed array warnings, skipped patches...).
verbose = 0
